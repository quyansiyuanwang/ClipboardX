[package]
name = "cx-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ClipboardX 同步后端：RemoteBackend trait 与 server/WebDAV/S3/memory 实现"

[dependencies]
attohttpc = { version = "0.31", default-features = false, features = [
    "basic-auth",
    "tls-rustls-native-roots-ring",
    "tls-rustls-webpki-roots-ring",
] }
base64.workspace = true
cx-core.workspace = true
cx-proto.workspace = true
log.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
# attohttpc 的 rustls 后端接受 rustls 自己的 DER 证书类型；
# 该类型来自 rustls-pki-types，而 attohttpc 的 tls 模块是私有的，只能直接依赖它。
rustls-pki-types = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
