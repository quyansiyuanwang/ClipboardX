name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: 测试与静态检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（版本由 rust-toolchain.toml 固定）
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（警告即错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace

      - name: Release 构建
        run: cargo build --release --workspace

      - name: 二进制体积预算
        shell: bash
        run: |
          set -euo pipefail
          echo "== 体积预算：cx < 6 MB，cx-server < 5 MB"
          found=0
          for f in target/release/cx target/release/cx.exe \
                   target/release/cx-server target/release/cx-server.exe; do
            [ -f "$f" ] || continue
            found=1
            bytes=$(wc -c < "$f")
            mb=$(awk "BEGIN{printf \"%.2f\", $bytes/1048576}")
            printf '  %-36s %s MB\n' "$f" "$mb"
            case "$f" in
              *cx-server*) budget=5242880 ;;
              *) budget=6291456 ;;
            esac
            if [ "$bytes" -gt "$budget" ]; then
              echo "::error::$f 超出体积预算（$mb MB）"
              exit 1
            fi
          done
          [ "$found" = 1 ] || { echo "::error::未找到构建产物"; exit 1; }

  msi:
    name: Windows MSI 构建与安装验收
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: 构建 MSI（WiX v4，版本锁定在 .config/dotnet-tools.json）
        shell: pwsh
        run: ./scripts/build-msi.ps1

      - name: 安装 / 自启 / 卸载 验收
        shell: pwsh
        run: |
          $msi = (Get-ChildItem -Path dist -Filter *.msi | Select-Object -First 1).FullName
          ./scripts/verify-msi.ps1 -Msi $msi

      - name: 上传 MSI
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardX-windows-msi
          path: dist/*.msi
          if-no-files-found: error

  dmg:
    name: macOS DMG 构建与安装验收
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 与 x86_64 目标（用于 lipo 出通用二进制）
        run: |
          rustup show
          rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: 构建 DMG（pkgbuild + productbuild + hdiutil）
        run: bash packaging/macos/build-dmg.sh

      - name: 挂载 / 安装 / 卸载 验收
        run: sudo bash packaging/macos/verify-dmg.sh "$(ls dist/*.dmg | head -n1)"

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardX-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  deb:
    name: Linux deb 构建与安装验收
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: 构建 deb（仅依赖 dpkg-deb）
        run: bash packaging/linux/build-deb.sh

      - name: 安装 / 卸载 验收
        run: sudo bash packaging/linux/verify-deb.sh "$(ls dist/*.deb | head -n1)"


        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11

      - name: Xvfb 下冒烟（当前仅验证二进制可在虚拟 X 会话中启动）
        run: |
          set -euo pipefail
          xvfb-run -a /usr/bin/cx version
          xvfb-run -a /usr/bin/cx version --json | grep -q '"name"'

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardX-linux-deb
          path: dist/*.deb
          if-no-files-found: error
