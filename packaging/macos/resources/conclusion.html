<h2>安装完成</h2>
<p>在终端里试试：</p>
<ul>
  <li><code>cx version</code> —— 确认安装成功</li>
  <li><code>cx status</code> —— 查看守护进程与后端状态</li>
  <li><code>cx tui</code> —— 打开终端界面</li>
  <li><code>cx backend add webdav …</code> —— 配置同步后端</li>
</ul>
<p>如果终端提示「未找到命令」，请新开一个终端窗口（<code>/usr/local/bin</code> 已在 PATH 中）。</p>
<p>未签名的安装包首次运行可能被 Gatekeeper 拦截：右键点击安装包选择「打开」，
或执行 <code>xattr -dr com.apple.quarantine &lt;文件&gt;</code>。</p>
</body>
