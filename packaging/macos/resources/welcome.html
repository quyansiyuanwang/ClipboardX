<h2>ClipboardX</h2>
<p>一台设备复制，其他设备直接粘贴。完全本地 / 自建，无需注册账号。</p>
<ul>
  <li>命令行工具 <code>cx</code> 安装到 <code>/usr/local/bin</code></li>
  <li>终端界面：<code>cx tui</code></li>
  <li>同步后端可选：自建服务端、WebDAV（Nextcloud 等）、S3（MinIO / R2 / AWS）</li>
  <li>内容端到端加密，服务端与对象存储只见密文</li>
</ul>
<p><b>关于自启</b>：剪贴板只能在登录用户会话中访问，因此本安装包使用
LaunchAgent（<i>不是</i> LaunchDaemon），登录后自动在后台同步。</p>
</body>
</html>
